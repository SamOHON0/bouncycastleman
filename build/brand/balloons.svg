<svg xmlns="http://www.w3.org/2000/svg" width="250" height="300" viewBox="0 0 250 300">
  <!-- Three balloons, drawn in the same hand as castle.svg, bunting.svg and
       wave.svg: FLAT FILLS, one ink outline, 3 to 3.5px, no gradients and no
       soft shadows. Colours are taken from the category palette so the hero
       previews the colour language the shelves below use.
       Strings first so the balloon bodies sit over the knot joins. -->
  <g fill="none" stroke="#0b1a2e" stroke-width="3" stroke-linecap="round">
    <path d="M52 112 Q40 176 60 226 Q74 262 62 292"/>
    <path d="M133 92 Q149 156 129 208 Q114 246 128 284"/>
    <path d="M204 134 Q216 186 199 228 Q186 260 197 288"/>
  </g>
  <g stroke="#0b1a2e" stroke-width="3.5" stroke-linejoin="round">
    <ellipse cx="52" cy="64" rx="38" ry="47" fill="#fec521"/>
    <path d="M45 110 L59 110 L52 122 Z" fill="#fec521"/>
    <ellipse cx="133" cy="44" rx="34" ry="43" fill="#c81e6a"/>
    <path d="M127 86 L139 86 L133 98 Z" fill="#c81e6a"/>
    <ellipse cx="204" cy="88" rx="31" ry="39" fill="#6d28d9"/>
    <path d="M198 126 L210 126 L204 138 Z" fill="#6d28d9"/>
  </g>
  <!-- Highlights, as flat shapes rather than gradients, same as the castle. -->
  <g fill="#fff" opacity=".45">
    <ellipse cx="39" cy="45" rx="9" ry="14" transform="rotate(-18 39 45)"/>
    <ellipse cx="121" cy="27" rx="8" ry="12" transform="rotate(-18 121 27)"/>
    <ellipse cx="193" cy="72" rx="7" ry="11" transform="rotate(-18 193 72)"/>
  </g>
</svg>
